apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhdp-scheduler
rules:
  # Read namespaces for validation
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Read/patch Babylon workshop resources
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["workshops", "workshopprovisions", "resourceclaims"]
    verbs: ["get", "list", "patch"]
  # Read catalog items for num_users validation
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["catalogitems"]
    verbs: ["get", "list"]
