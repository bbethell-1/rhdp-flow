name: RHDP-Flow CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!VERSION'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!VERSION'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest httpx ruff mypy
      - name: Run ruff linting
        run: ruff check . --output-format=github
        continue-on-error: false
      - name: Run mypy type checking
        run: mypy --install-types --non-interactive api/ rhdp_flow.py
        continue-on-error: true
      - run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npx tsc -p tsconfig.build.json
      - run: cd frontend && npx vitest run
      - run: cd frontend && npx vite build

  container-build-pr:
    name: Container Build (PR)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build container (validation only)
        run: docker build -f dockerfiles/Dockerfile -t rhdp-flow:pr-check .

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - run: |
          docker build -f dockerfiles/Dockerfile \
            -t rhdp-flow:${{ steps.version.outputs.tag }} \
            -t rhdp-flow:ci .
