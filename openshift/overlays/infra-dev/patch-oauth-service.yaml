apiVersion: v1
kind: Service
metadata:
  name: rhdp-scheduler-service
  annotations:
    # Have the service-ca operator mint a serving cert for the sidecar's HTTPS
    # listener (:8443). Consumed via the rhdp-scheduler-tls Secret.
    service.beta.openshift.io/serving-cert-secret-name: rhdp-scheduler-tls
spec:
  ports:
    # Public entry point — oauth-proxy sidecar. The Route targets this port.
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: https
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
