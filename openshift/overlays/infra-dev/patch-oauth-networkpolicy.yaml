apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhdp-scheduler
spec:
  ingress:
    # Router only reaches the oauth-proxy sidecar (:8443); the app's :8000 is
    # never exposed externally.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8443
    # Same-namespace callers may hit either port.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
