apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhdp-flow

resources:
  - ../../base
  - namespace.yaml
  - webhook-rolebinding.yaml
  - oauth-proxy.yaml

configMapGenerator:
  - name: rhdp-scheduler-config  # Match base name for merge to work
    behavior: merge
    literals:
      - CLUSTER_DOMAIN=ocpv-infra01.dal12.infra.demo.redhat.com
      - ENVIRONMENT=dev
      # LOG_FORMAT is in base, no need to duplicate

commonLabels:
  environment: dev

patches:
  # OAuth-proxy sidecar + supporting Service/Route/SA/NetworkPolicy changes.
  - path: patch-oauth-sa.yaml
  - path: patch-oauth-service.yaml
  - path: patch-oauth-route.yaml
  - path: patch-oauth-networkpolicy.yaml
  - path: patch-oauth-deployment.yaml

  - target:
      kind: Route
      name: rhdp-scheduler
    patch: |-
      - op: replace
        path: /spec/host
        value: rhdp-flow.apps.ocpv-infra01.dal12.infra.demo.redhat.com

  # NOTE: the ClusterRoleBinding already lists the rhdp-flow ServiceAccount as an
  # explicit subject in base/clusterrolebinding.yaml, so no subject patch is
  # needed here.

  - target:
      kind: Secret
      name: rhdp-flow-api
    patch: |-
      - op: add
        path: /stringData/OPENSHIFT_SERVER
        value: "https://api.ocpv-infra01.dal12.infra.demo.redhat.com:6443"
      # OPENSHIFT_TOKEN is intentionally NOT stored here. It is a live
      # ServiceAccount credential and must never be committed to git.
      # Set it directly on the in-cluster secret instead, e.g.:
      #   oc create secret generic rhdp-flow-api -n rhdp-flow \
      #     --from-literal=OPENSHIFT_TOKEN=<token> --dry-run=client -o yaml \
      #     | oc apply -f -
      # (Feature 2 / External Secrets Operator will manage this going forward.)
