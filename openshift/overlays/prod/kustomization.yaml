apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhdp-scheduler

resources:
  - ../../base
  - pdb.yaml

patches:
  # 1 replica (deploy jobs still in-memory; schedules/results persist on PVC)
  - target:
      kind: Deployment
      name: rhdp-scheduler
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  - target:
      kind: BuildConfig
      name: rhdp-scheduler
    patch: |
      - op: replace
        path: /spec/resources/limits/memory
        value: 4Gi
