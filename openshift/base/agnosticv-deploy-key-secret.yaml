# Real key material is NOT committed here. This manifest documents the
# expected shape; the actual Secret is created out-of-band (e.g. via `oc
# create secret generic` or a sealed-secrets/vault-injected equivalent) using
# a dedicated, read-only SSH deploy key scoped only to rhpds/agnosticv,
# requested from that repo's admins.
#
# Expected creation command (run manually, key material never committed):
#   oc create secret generic agnosticv-deploy-key \
#     --from-file=ssh-privatekey=/path/to/agnosticv-readonly-deploy-key \
#     --type=kubernetes.io/ssh-auth
apiVersion: v1
kind: Secret
metadata:
  name: agnosticv-deploy-key
type: kubernetes.io/ssh-auth
data: {}
