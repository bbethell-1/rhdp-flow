apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhdp-scheduler
rules:
  # Read namespaces for validation
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Manage Babylon workshop resources (deploy creates, operations patch, cleanup deletes).
  # multiworkshops required for multi-asset / Asset_CIs rows (Roadshow, LB1577, etc.).
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["workshops", "workshopprovisions", "resourceclaims", "multiworkshops"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read catalog items for num_users validation
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["catalogitems"]
    verbs: ["get", "list"]
