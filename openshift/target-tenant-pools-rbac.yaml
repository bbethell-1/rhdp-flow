# Apply separately on each configured deployment target, not the hosting cluster.
# Workshop Manager owns workshop-scoped pools. Flow reads shared references and
# may create them only through its explicit reference-pool action.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhdp-flow-tenant-pools
  namespace: shared-clusters
rules:
  - apiGroups: [babylon.gpte.redhat.com]
    resources: [tenantclusterpools]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhdp-flow-tenant-pools
  namespace: shared-clusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhdp-flow-tenant-pools
subjects:
  - kind: ServiceAccount
    name: rhdp-flow-deployer
    namespace: rhdp-flow
---
# Capacity checks count existing Poolboy ResourceClaims across the target
# cluster.  Keep this read-only and cluster-scoped because the query uses the
# cluster-level custom-object endpoint (ResourceClaims may live in any target
# namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhdp-flow-resourceclaim-observer
rules:
  - apiGroups: [poolboy.gpte.redhat.com]
    resources: [resourceclaims]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhdp-flow-resourceclaim-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhdp-flow-resourceclaim-observer
subjects:
  - kind: ServiceAccount
    name: rhdp-flow-deployer
    namespace: rhdp-flow
